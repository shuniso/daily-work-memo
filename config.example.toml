# つらつら

data_dir = ""
# 本文のフォント。空なら同梱の HackGen。OS にインストール済みのフォント名（例: "BIZ UDGothic"）も指定できる。
font_family = ""
font_size = 15
# 起動時にウィンドウを最前面へ固定する。起動後はボタンか Primary+Shift+T で切り替える。
always_on_top = false
autosave_debounce_ms = 250
# 日次メモを残す日数。これより古い日次メモは起動時・日付切り替え時に削除する。0 で削除しない。
retention_days = 30
entry_header = "[{time}] {label}"

[[entry_types]]
id = "work"
label = "作業メモ"
key = "w"
template = ""

[[entry_types]]
id = "redmine"
label = "Redmine確認"
key = "r"
template = ""

[[entry_types]]
id = "slack"
label = "Slack確認"
key = "s"
template = ""

[[entry_types]]
id = "mail"
label = "メール"
key = "m"
template = ""

[[entry_types]]
id = "meeting"
label = "打ち合わせ"
key = "g"
template = ""

# 行頭に付ける目印。text をそのまま挿入する（末尾の空白も含む）。
[[prefixes]]
text = "<action item> "
key = "a"

[[prefixes]]
text = "<remind> "
key = "r"

[[prefixes]]
text = "<重要> "
key = "i"
